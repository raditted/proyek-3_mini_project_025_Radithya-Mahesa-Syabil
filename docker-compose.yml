services:
    mysql:
        image: mysql:8.0
        container_name: mbg_mysql
        restart: unless-stopped
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: mbg_db
            MYSQL_USER: mbg_user
            MYSQL_PASSWORD: mbg_password
        volumes:
            - mysql_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: mbg_phpmyadmin
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            PMA_HOST: mysql
            PMA_USER: root
            PMA_PASSWORD: root
        depends_on:
            - mysql

volumes:
    mysql_data:
